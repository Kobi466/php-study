version: "3.9"
services:
  php:
    build: .
    container_name: php_basic
    volumes:
      - ./src:/var/www/html
    ports:
      - "8099:80"
  db:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Mount file init.sql để Docker tự động chạy khi khởi tạo
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"

volumes:
  db_data: